<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF4FB">
  <meta name="description" content="치아미백 패키지 안내를 확인하고 네이버에서 예약하세요.">
  <title>치아미백 패키지 예약 안내</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #EEF4FB; }
    body { margin: 0; color: #0E2A47; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    main { width: min(100%, 600px); margin: 0 auto; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
    .package { display: block; width: 100%; height: auto; }
    .reservation { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 600px); padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px)); background: #EEF4FB; border-top: 1px solid #DAE4EF; }
    .reservation a { display: flex; align-items: center; justify-content: center; min-height: 58px; border-radius: 12px; background: #03C75A; color: #fff; text-decoration: none; font-size: 20px; font-weight: 800; line-height: 1.4; }
    .reservation a:hover { background: #02B451; }
    .reservation a:active { background: #029B46; }
    .reservation a:focus-visible { outline: 3px solid #0E2A47; outline-offset: 4px; }
  </style>
</head>
<body>
  <main aria-label="치아미백 패키지 안내">
    <img class="package" src="package.jpg" width="1080" height="1920" alt="치아는 하얗게, 피부는 맑게. 원데이 치아미백과 피코 피부미백 30만원, 원데이 치아미백과 스킨부스터 30만원, 치아미백 3회와 동안보톡스 1회 40만원, 치아미백 3회와 스킨보톡스 1회 40만원. 자세한 구성과 시술 안내는 이미지에서 확인하세요.">
  </main>
  <footer class="reservation">
    <a href="https://booking.naver.com/booking/13/bizes/1581907" aria-label="네이버에서 뷰티덴 치과의원 예약하기">네이버 예약하기</a>
  </footer>
</body>
</html>
